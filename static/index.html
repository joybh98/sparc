<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SPARC Frontier-Model Eval</title>
<style>
  :root { color-scheme: light; }   /* the palette below is light-only */
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
  header { background: #14213d; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; color: #aeb8d0; }
  header label { font-size: 12px; color: #aeb8d0; display: block; margin-bottom: 3px; }
  header select { min-width: 260px; }
  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px; }
  .single { max-width: 900px; margin: 0 auto; padding: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  .panel h3 { margin: 0 0 10px; font-size: 14px; }
  select, textarea, input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d0d3da; border-radius: 6px; font-size: 13px; }
  video { width: 100%; border-radius: 8px; background: #000; margin-top: 8px; }
  button { background: #14213d; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.secondary { background: #eef0f4; color: #14213d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e8eaee; vertical-align: top; }
  th { color: #666; font-weight: 600; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .tag.match { background: #dff3e4; color: #1c6b3a; }
  .tag.partial { background: #fdf0d5; color: #8a5a00; }
  .tag.model-only { background: #e6ecff; color: #2b4a9b; }
  .tag.you-only { background: #f3e3f7; color: #7a2f8f; }
  .response-card { border: 1px solid #e2e4e9; border-radius: 8px; padding: 10px; font-size: 13px; margin-top: 10px; }
  .response-card .meta { color: #888; font-size: 11px; margin-bottom: 6px; }
  .response-card .q { font-weight: 600; margin-bottom: 6px; }
  .response-card .answer { white-space: pre-wrap; }
  .error { color: #c0392b; }
  .assessment { background: #fff8e8; border: 1px solid #f0dca0; border-radius: 8px; padding: 8px 10px; font-size: 12px; margin-top: 8px; }
  .mark-row { display: flex; justify-content: space-between; gap: 6px; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 12px; }
  small.hint { color: #888; }
  small.hint.error { color: #c0392b; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  .agent-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .agent-bar label { font-size: 12px; color: #666; white-space: nowrap; }
  .agent-bar select { flex: 1; }
  details.cfg { margin-bottom: 8px; font-size: 12px; }
  details.cfg summary { cursor: pointer; color: #555; }
  details.cfg textarea { font-family: ui-monospace, Menlo, monospace; font-size: 11px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { background: #eef0f4; color: #14213d; border-radius: 12px; padding: 3px 10px; font-size: 12px; cursor: pointer; border: none; }
  .send-row { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  .status-line { min-height: 16px; margin-bottom: 4px; }
  .badge { display: inline-block; background: #eef0f4; color: #444; border-radius: 4px; padding: 0 6px; font-size: 11px; margin-right: 4px; }
  .badge.warn { background: #fdf0d5; color: #8a5a00; }
  .badge.err { background: #fbe3e0; color: #a02c20; }

  /* trace panel */
  details.trace { margin-top: 8px; border: 1px solid #e2e4e9; border-radius: 8px; font-size: 12px; background: #fafbfc; }
  details.trace > summary { cursor: pointer; padding: 6px 10px; color: #333; font-weight: 600; }
  .trace-body { padding: 4px 10px 10px; }
  .iter { border-left: 3px solid #c9d3ee; padding: 2px 0 2px 10px; margin: 8px 0; }
  .iter-head { color: #666; font-size: 11px; }
  .think { margin: 3px 0; color: #333; white-space: pre-wrap; }
  .tool { margin: 6px 0; padding: 6px 8px; background: #fff; border: 1px solid #e6e8ee; border-radius: 6px; }
  .tool.is-error { border-color: #efb9b2; background: #fff6f5; }
  .tool .name { font-family: ui-monospace, Menlo, monospace; font-weight: 600; color: #14213d; }
  .tool .args { font-family: ui-monospace, Menlo, monospace; color: #666; font-size: 11px; word-break: break-all; }
  .tool .result { margin-top: 4px; white-space: pre-wrap; color: #333; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .thumb { text-align: center; font-size: 10px; color: #666; }
  .thumb img { display: block; height: 72px; border-radius: 4px; border: 1px solid #ccd; cursor: pointer; background: #000; }
  .ctx { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 12px; color: #444; }
  .ctx img { height: 36px; border-radius: 4px; background: #000; }
  .ctx img:not([src]) { display: none; }
  a.ts { color: #2b4a9b; text-decoration: underline dotted; cursor: pointer; }
  .evidence { margin-top: 6px; }
  .conf { font-weight: 600; }
  .conf.high { color: #1c6b3a; }
  .conf.mid { color: #8a5a00; }
  .conf.low { color: #b03a2e; }
  .uncertainty { color: #8a5a00; font-size: 11px; margin-top: 3px; }
  .ev { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
  .ev img { width: 60px; border-radius: 4px; cursor: pointer; background: #000; }
  .verdicts { margin-top: 6px; display: flex; gap: 4px; align-items: center; }
  button.verdict { background: #eef0f4; color: #14213d; padding: 1px 8px; font-size: 11px; border-radius: 10px; }
  button.verdict.active.correct { background: #1c6b3a; color: #fff; }
  button.verdict.active.incorrect { background: #b03a2e; color: #fff; }
  button.verdict.active.unsure { background: #8a5a00; color: #fff; }
  .seek { background: #e6ecff; color: #2b4a9b; border-radius: 10px; padding: 0 8px; font-size: 11px; cursor: pointer; border: none; margin-left: 6px; }
  .note { color: #8a5a00; font-size: 11px; margin: 4px 0; }
  .trace-status { display: flex; align-items: center; margin-top: 8px; font-size: 13px; color: #333; }
  header .dev { display: flex; align-items: center; gap: 6px; margin: 6px 0 0; cursor: pointer; }
  .spin { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border: 2px solid #c9d3ee; border-top-color: #14213d; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div>
    <h1>SPARC — Frontier model vs. your review (barebones)</h1>
    <p>Chat with a model, or upload a clip: an agent analyzes it automatically, then you can talk to it and mark your own steps.</p>
  </div>
  <div>
    <label for="modelSelect">Model</label>
    <select id="modelSelect"></select>
    <label class="dev" title="Open the agent's full reasoning trace by default"><input type="checkbox" id="devView" /> Developer view: expand reasoning</label>
  </div>
</header>

<main id="root"></main>

<script src="/static/common.js"></script>
<script src="/static/chat_panel.js"></script>
<script src="/static/text_panel.js"></script>
<script src="/static/video_panel.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
